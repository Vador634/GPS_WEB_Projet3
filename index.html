<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Wipsee Mobile GPS : enregistrement de trajets professionnels (distance, durée, péages, véhicule) avec carte et export PDF.">
    <title>Wipsee Mobile GPS - Enregistrement de trajet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========================
     HEADER
     ======================== -->
<header>
    <h1>Wipsee Mobile GPS</h1>
</header>

<!-- ========================
     DÉPART / ARRIVÉE ET CONTRÔLES
     ======================== -->
<section id="route-form">
    <p>Ville de départ : <span id="startCity">Localisation…</span></p>
    <input id="startManual" class="form-control hidden" placeholder="Ville de départ (ex : Bayonne)" autocomplete="address-level2">
    <input id="end" class="form-control" placeholder="Ville d'arrivée" autocomplete="address-level2">

    <button id="startTrip" class="btn btn-primary" disabled>Démarrer</button>
    <button id="stopTrip" class="btn btn-ghost" disabled>Arrêter</button>
    <button id="retryGeoBtn" class="btn btn-ghost">Réessayer la localisation</button>
</section>

<!-- ========================
     MESSAGES DE STATUT
     ======================== -->
<section id="info" aria-live="polite">
    <p id="warning" class="hidden">Mode simulation : le trajet suit l'itinéraire estimé (pas de GPS)</p>
    <p id="liveStatus"></p>
</section>

<!-- ========================
     CARTE (Leaflet)
     ======================== -->
<div id="map"></div>

<!-- ========================
     RÉCAPITULATIF ET ENREGISTREMENT
     ======================== -->
<section id="result" class="hidden">
    <h2>Récapitulatif du trajet</h2>

    <ul>
        <li id="distance"></li>
        <li id="duration"></li>
        <li id="startTime"></li>
        <li id="endTime"></li>
        <li id="tollResult"></li>
    </ul>

    <label for="firstname">Prénom du conducteur</label>
    <input id="firstname" class="form-control" autocomplete="given-name">

    <label for="lastname">Nom du conducteur</label>
    <input id="lastname" class="form-control" autocomplete="family-name">

    <label for="remark">Remarque</label>
    <textarea id="remark" class="form-control"></textarea>

    <label for="toll">Péages (€)</label>
    <input id="toll" type="number" step="0.01" min="0" class="form-control" value="0">

    <label for="carSelectForSave">Véhicule</label>
    <select id="carSelectForSave" class="form-control">
        <option value="">-- Aucun --</option>
    </select>

    <div class="button-group">
        <button id="saveTrip" class="btn btn-primary">Valider le trajet</button>
        <button id="clearTollBtn" type="button" class="btn btn-ghost">Réinitialiser le péage</button>
    </div>
</section>

<!-- ========================
     FOOTER
     ======================== -->
<footer>
    <a href="dashboard.html" class="btn btn-ghost btn-block">Voir le dashboard</a>
</footer>

<!-- ========================
     SCRIPTS
     ======================== -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/smoke.js"></script>
<script src="js/app.js"></script>

</body>
</html>
