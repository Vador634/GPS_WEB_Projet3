<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wipsee Mobile GPS - Enregistrement de trajet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========================
     HEADER
     ======================== -->
<header>
    <h1>Wipsee Mobile GPS</h1>
</header>

<!-- ========================
     ROUTE FORM - Entrée départ/arrivée et contrôles
     ======================== -->
<section id="route-form">
    <p>Ville de départ : <span id="startCity">Localisation...</span></p>
    <input id="end" class="form-control" placeholder="Ville d'arrivée">

    <button id="startTrip" class="btn btn-primary" disabled>Démarrer</button>
    <button id="stopTrip" class="btn btn-ghost" disabled>Arrêter</button>
    <button id="retryGeoBtn" class="btn btn-ghost">Réessayer localisation</button>
</section>

<!-- ========================
     INFO SECTION - Messages de statut
     ======================== -->
<section id="info">
    <p id="warning" class="hidden">Simulation non réelle</p>
    <p id="liveStatus"></p>
</section>

<!-- ========================
     MAP CONTAINER - Leaflet.js carte interactive
     ======================== -->
<div id="map"></div>

<!-- ========================
     RESULT SECTION - Résumé du trajet et saisie utilisateur
     ======================== -->
<section id="result" class="hidden">
    <h2>Récapitulatif du trajet</h2>

    <ul>
        <li id="distance"></li>
        <li id="duration"></li>
        <li id="startTime"></li>
        <li id="endTime"></li>
        <li id="tollResult"></li>
    </ul>

    <label>Prénom conducteur</label>
    <input id="firstname" class="form-control">

    <label>Nom conducteur</label>
    <input id="lastname" class="form-control">

    <label>Remarque</label>
    <textarea id="remark" class="form-control"></textarea>

    <label>Péages (€)</label>
    <input id="toll" type="number" step="0.01" min="0" class="form-control" value="0">

    <label>Véhicule</label>
    <select id="carSelectForSave" class="form-control">
        <option value="">-- Aucun --</option>
    </select>

    <div class="button-group">
        <button id="saveTrip" class="btn btn-primary">Valider le trajet</button>
        <button id="clearTollBtn" type="button" class="btn btn-ghost">Réinitialiser péage</button>
    </div>
</section>

<!-- ========================
     FOOTER
     ======================== -->
<footer>
    <a href="dashboard.html" class="btn btn-ghost btn-block">Voir le dashboard</a>
</footer>

<!-- ========================
      SCRIPTS - Bibliothèques externes et scripts locaux
      ======================== -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Modules locaux -->
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/pdf-export.js"></script>
<script src="js/smoke.js"></script>
<script src="js/app.js"></script>

</body>
</html>
